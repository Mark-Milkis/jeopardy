version: '3.8'

services:
  jeopardy:
    build:
      context: .
      dockerfile: Dockerfile
    image: jeopardy:latest
    container_name: jeopardy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount games directory for custom games persistence
      - ./games:/usr/src/app/games
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Development version with hot reload
  jeopardy-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: jeopardy:dev
    container_name: jeopardy-dev
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      # Mount source code for hot reload
      - ./server:/usr/src/app/server
      - ./client/src:/usr/src/app/client/src
      - ./games:/usr/src/app/games
      - /usr/src/app/node_modules
      - /usr/src/app/client/src/node_modules
    restart: unless-stopped
    profiles:
      - dev
