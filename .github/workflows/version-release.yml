name: Release Version

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on semantic version tags like v2.0.0, v2.1.0, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Update package versions
        run: |
          node scripts/sync-version.js --version ${{ steps.extract_version.outputs.version }}
          
      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: |
          cd client/src
          npm install

      - name: Build client
        run: |
          cd client/src
          npm run build
          
      - name: Create release artifacts
        run: |
          mkdir -p release
          cp -r server release/
          cp -r public release/
          cp -r games release/
          cp package.json package-lock.json release/
          cp Dockerfile release/
          cp -r client/src/dist release/public/
          cd release
          tar -czf ../jeopardy-pro-v${{ steps.extract_version.outputs.version }}.tar.gz .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jeopardy:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jeopardy:${{ steps.extract_version.outputs.version }}
          build-args: |
            VERSION=${{ steps.extract_version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.extract_version.outputs.version }}
          files: |
            jeopardy-pro-v${{ steps.extract_version.outputs.version }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
