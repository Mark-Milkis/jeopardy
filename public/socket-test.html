<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        .status {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .connected {
            background: #16213e;
            border: 2px solid #0f3460;
        }
        .disconnected {
            background: #2d1b1b;
            border: 2px solid #8b0000;
        }
        button {
            background: #0f3460;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #16213e;
        }
        #log {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #0f3460;
            padding-left: 10px;
        }
        .log-emit {
            border-left-color: #ff6b6b;
        }
        .log-receive {
            border-left-color: #4ecdc4;
        }
        .log-info {
            border-left-color: #ffe66d;
        }
        h1 {
            color: #4ecdc4;
        }
        h2 {
            color: #ff6b6b;
            margin-top: 30px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #0f3460;
            background: #16213e;
            color: white;
        }
    </style>
</head>
<body>
    <h1>🎮 Jeopardy Pro - Socket.IO Test</h1>
    
    <div id="status" class="status disconnected">
        Status: <span id="statusText">Disconnected</span>
    </div>

    <h2>Connection Test</h2>
    <div class="controls">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <h2>Player Actions</h2>
    <div class="controls">
        <div>
            <input type="text" id="playerName" placeholder="Player Name" value="TestPlayer">
            <button onclick="joinGame()">Join Game</button>
        </div>
        <button onclick="buzz()">Buzz In</button>
        <div>
            <input type="number" id="wager" placeholder="Wager" value="1000">
            <button onclick="submitWager()">Submit Wager</button>
        </div>
    </div>

    <h2>Host Actions</h2>
    <div class="controls">
        <button onclick="armBuzzers()">Arm Buzzers</button>
        <button onclick="handleJudgment(true)">✓ Correct</button>
        <button onclick="handleJudgment(false)">✗ Wrong</button>
        <button onclick="resetGame()">Reset Game</button>
    </div>

    <h2>Event Log</h2>
    <div id="log"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = null;
        let currentPlayerId = null;
        const gameId = 'test-game';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusDiv.className = 'status connected';
                statusText.textContent = 'Connected ✓';
            } else {
                statusDiv.className = 'status disconnected';
                statusText.textContent = 'Disconnected ✗';
            }
        }

        function connect() {
            if (socket && socket.connected) {
                log('Already connected', 'info');
                return;
            }

            socket = io('http://localhost:3000');

            socket.on('connect', () => {
                log('Connected to Socket.IO server', 'info');
                updateStatus(true);
            });

            socket.on('disconnect', () => {
                log('Disconnected from server', 'info');
                updateStatus(false);
            });

            socket.on('gameState:update', (gameState) => {
                log(`Received game state update: ${JSON.stringify(gameState).substring(0, 100)}...`, 'receive');
                console.log('Full game state:', gameState);
            });

            socket.on('player:joined', ({ playerId, player }) => {
                currentPlayerId = playerId;
                log(`Player joined! ID: ${playerId}, Name: ${player.name}`, 'receive');
            });

            socket.on('player:earlyBuzz', ({ playerId, penaltyDuration }) => {
                log(`Early buzz! Locked out for ${penaltyDuration}ms`, 'receive');
            });

            socket.on('player:lockedOut', ({ playerId, remainingTime }) => {
                log(`Locked out for ${remainingTime}ms`, 'receive');
            });

            log('Connecting...', 'info');
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                updateStatus(false);
                log('Disconnected', 'info');
            }
        }

        function joinGame() {
            if (!socket || !socket.connected) {
                log('Not connected! Click Connect first.', 'info');
                return;
            }

            const playerName = document.getElementById('playerName').value;
            socket.emit('game:join', { gameId, playerName });
            log(`Emitted: game:join (${playerName})`, 'emit');
        }

        function buzz() {
            if (!socket || !socket.connected) {
                log('Not connected!', 'info');
                return;
            }
            if (!currentPlayerId) {
                log('Not joined as player! Click Join Game first.', 'info');
                return;
            }

            socket.emit('player:buzz', { gameId, playerId: currentPlayerId });
            log(`Emitted: player:buzz`, 'emit');
        }

        function submitWager() {
            if (!socket || !socket.connected || !currentPlayerId) {
                log('Not connected or not joined!', 'info');
                return;
            }

            const wager = parseInt(document.getElementById('wager').value);
            socket.emit('player:submitWager', { gameId, playerId: currentPlayerId, amount: wager });
            log(`Emitted: player:submitWager (${wager})`, 'emit');
        }

        function armBuzzers() {
            if (!socket || !socket.connected) {
                log('Not connected!', 'info');
                return;
            }

            socket.emit('host:armBuzzers', { gameId });
            log(`Emitted: host:armBuzzers`, 'emit');
        }

        function handleJudgment(correct) {
            if (!socket || !socket.connected) {
                log('Not connected!', 'info');
                return;
            }

            socket.emit('host:handleJudgment', { gameId, correct });
            log(`Emitted: host:handleJudgment (${correct ? 'correct' : 'wrong'})`, 'emit');
        }

        function resetGame() {
            if (!socket || !socket.connected) {
                log('Not connected!', 'info');
                return;
            }

            socket.emit('host:resetGame', { gameId });
            log(`Emitted: host:resetGame`, 'emit');
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // Auto-connect on page load
        window.addEventListener('load', () => {
            log('Page loaded. Click Connect to start.', 'info');
        });
    </script>
</body>
</html>
